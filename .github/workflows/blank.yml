name: Build MallaJaw APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install and Build APK
        run: |
          npm install
          npm run build
          mkdir -p dist
          [ -d "build" ] && cp -r build/* dist/ || true
          [ -d "public" ] && cp -r public/* dist/ || true
          npx cap init MallaJaw com.benachref.mallajaw --web-dir=dist || true
          npx cap add android || true
          npx cap sync android || true
          if [ -d "android" ]; then cd android && ./gradlew assembleDebug; fi
