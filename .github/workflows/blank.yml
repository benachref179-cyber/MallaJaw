
name: Build MallaJaw APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Prepare web assets
        run: |
          node --input-type=module <<'NODE'
          import { cpSync, existsSync, mkdirSync } from 'node:fs';

          const roots = [
            'dist',
            'dist/client',
            '.vercel/output/static',
            '.output/public'
          ];

          const src = roots.find(
            path => existsSync(`${path}/index.html`)
          );

          if (!src) {
            console.error('ERROR: No index.html found after build.');
            process.exit(1);
          }

          mkdirSync('www', { recursive: true });
          cpSync(src, 'www', { recursive: true });
          console.log(`Web assets copied from ${src}`);
          NODE

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Capacitor
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init MallaJaw com.mallajaw.app --web-dir www
          npx cap add android
          npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MallaJaw-APK
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
