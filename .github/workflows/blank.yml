name: Build MallaJaw APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npx vite build

      - name: Prepare dist for Capacitor
        run: node --input-type=module -e 'import{cpSync,existsSync,readdirSync}from"node:fs";const roots=[".vercel/output/static",".output/public","dist/client"];let src="";for(const r of roots){if(existsSync(r+"/index.html")){src=r;break}}if(!src){console.log("no index.html");for(const r of [".vercel",".output","dist"]){console.log(r, existsSync(r)?readdirSync(r).slice(0,20).join(","):"missing")}process.exit(1)}cpSync(src,"www",{recursive:true});console.log("copied "+src)'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Install Capacitor
        run: npm install @capacitor/core @capacitor/cli @capacitor/android && npx cap init MallaJaw com.mallajaw.app --web-dir www && npx cap add android && npx cap sync android

      - name: Build APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: MallaJaw-APK
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
