name: Build MallaJaw APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Prepare dist for Capacitor
        run: |
          echo "---- build output ----"
          find .vercel .output dist -name 'index.html' -o -name '*.html' 2>/dev/null | head -80 || true
          WEB=""
          for c in .vercel/output/static .output/public dist/client; do
            if [ -f "$c/index.html" ]; then WEB="$c"; break; fi
          done
          if [ -z "$WEB" ]; then
            HTML=$(find .vercel .output dist -name 'index.html' -print -quit 2>/dev/null || true)
            if [ -n "\( HTML" ]; then WEB= \)(dirname "$HTML"); fi
          fi
          if [ -z "$WEB" ]; then
            echo "No index.html produced by the web build"
            exit 1
          fi
          echo "Using $WEB"
          rm -rf /tmp/www
          mkdir -p /tmp/www
          cp -a "$WEB"/. /tmp/www/
          rm -rf dist
          mkdir -p dist
          cp -a /tmp/www/. dist/
          test -f dist/index.html

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Install Capacitor
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init MallaJaw com.mallajaw.app --web-dir dist
          npx cap add android
          npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: MallaJaw-APK
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
