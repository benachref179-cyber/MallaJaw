
name: Build MallaJaw APK

on:
  workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Find index.html
        shell: bash
        run: |
          set -e
          echo "Searching for index.html..."
          find . -maxdepth 6 -type f -name index.html \
            -not -path "./node_modules/*" \
            -not -path "./.git/*"

          INDEX_FILE="$(find dist .vercel/output/static .output/public \
            -maxdepth 6 -type f -name index.html \
            2>/dev/null | head -n 1 || true)"

          if [ -z "$INDEX_FILE" ]; then
            echo "ERROR: No index.html found."
            exit 1
          fi

          mkdir -p www
          cp -a "$(dirname "$INDEX_FILE")"/. www/
          test -f www/index.html

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Capacitor
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          if [ ! -f capacitor.config.ts ] && [ ! -f capacitor.config.json ] && [ ! -f capacitor.config.js ]; then
            npx cap init MallaJaw com.mallajaw.app --web-dir www
          fi
          npx cap add android
          npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MallaJaw-APK
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
